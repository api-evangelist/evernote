aid: evernote
name: evernote
description: >-
  Evernote is a cross-platform note-taking, organization, and task-management
  application operated by Bending Spoons. It lets people capture notes, web
  clips, images, audio, and documents, sync them across devices, and search
  across their knowledge base. For developers, Evernote publishes the Evernote
  Cloud API — a Thrift-based (EDAM) service exposing UserStore and NoteStore
  operations for creating, reading, searching, sharing, and synchronizing notes,
  notebooks, tags, and resources. Authentication is via three-legged OAuth 1.0a
  or long-lived developer tokens, with a sandbox environment for development.
  Official SDKs cover Python, Java, Ruby, JavaScript/Node, PHP, iOS, Android, and
  C#. The classic EDAM API and SDKs are deprecated and no longer actively
  developed; Evernote is now building a Model Context Protocol (MCP) server to
  connect AI tools to notes.
